name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --no-daemon

      # A dropped or stubbed wallet2 symbol must fail here, before it can ship.
      - name: Native wallet ABI check
        run: |
          scripts/check_native_wallet_abi.sh
          scripts/check_native_wallet_abi.sh --self-test

      - name: Upload unit test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: unit-test-reports
          path: |
            app/build/reports/tests/
            monero-kit-android/monerokit/build/reports/tests/
          if-no-files-found: ignore

  # Key/address derivation and wallet creation through the real wallet2 library,
  # pinned to golden values (NativeWalletCreationTest). No network is used.
  native-wallet-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      API_LEVEL: 34
      TEST_CLASS: one.monero.moneroone.core.wallet.NativeWalletCreationTest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Build before the emulator starts, and only the emulator's ABI.
      - name: Build app and test APKs (x86_64)
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest -Pandroid.injected.build.abi=x86_64 --no-daemon

      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64

      - name: Create AVD and snapshot for the cache
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot created"

      - name: Native wallet test on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=${{ env.TEST_CLASS }} -Pandroid.injected.build.abi=x86_64 --no-daemon

      - name: Upload instrumented test reports on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: native-wallet-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
